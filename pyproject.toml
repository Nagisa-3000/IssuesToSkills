[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "arex-skill-graph"
version = "0.1.0"
description = "Evidence-grounded multi-level skill graph and retrieval prototype for AREX"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AREX Skill Graph contributors" }]
dependencies = []

[project.optional-dependencies]
hnsw = ["hnswlib>=0.8", "numpy>=2"]
ranker = ["torch>=2.2", "transformers>=4.45,<5", "tiktoken>=0.7"]
lora = ["peft>=0.13", "torch>=2.2", "transformers>=4.45,<5"]
census = ["duckdb==1.4.0"]
swe-runtime = ["docker==7.1.0"]
dev = ["pytest>=8", "ruff>=0.8", "jsonschema>=4.10"]

[project.scripts]
arex-skill-graph = "arex_skill_graph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arex_skill_graph = ["*.ps1"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint.per-file-ignores]
"experiments/*.py" = ["E402"]  # Standalone scripts bootstrap the local src path.
