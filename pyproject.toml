[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "arex-skill-graph"
version = "0.1.0"
description = "Evidence-grounded multi-level skill graph and retrieval prototype for AREX"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AREX Skill Graph contributors" }]
dependencies = []

[project.optional-dependencies]
hnsw = ["hnswlib>=0.8", "numpy>=2"]
dev = ["pytest>=8", "ruff>=0.8", "jsonschema>=4.10"]

[project.scripts]
arex-skill-graph = "arex_skill_graph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

